    <div class="nav-actions">
      <div class="lang-switch" role="group" aria-label="Language">

  <div class="mobile-menu hidden" id="mobile-menu" data-mobile-menu>

<main id="main" class="section container" style="max-width: 480px;">
  <h1 data-i18n-ar="تسجيل الدخول" data-i18n-en="Sign In">Sign In</h1>
  <p class="text-muted" data-i18n-ar="أدخل رقمك الجامعي وكلمة المرور للوصول إلى حسابك."
     data-i18n-en="Enter your Student ID and password to access your account.">
    Enter your Student ID and password to access your account.
  </p>

  <div data-form-alert></div>

  <form data-login-form novalidate>
    <div class="field" data-field="student_id">
      <label for="student_id" data-i18n-ar="الرقم الجامعي" data-i18n-en="Student ID">Student ID</label>
      <input class="input" type="text" id="student_id" name="student_id" autocomplete="username" required>
      <div class="field-error" role="alert"></div>
    </div>

    <div class="field" data-field="password">
      <label for="password" data-i18n-ar="كلمة المرور" data-i18n-en="Password">Password</label>
      <div class="password-field">
        <input class="input" type="password" id="password" name="password"
               autocomplete="current-password" required data-password-field>
        <button type="button" class="password-toggle" data-password-toggle aria-pressed="false"
                data-i18n-ar="إظهار" data-i18n-en="Show">Show</button>
      </div>
      <div class="field-error" role="alert"></div>
    </div>

    <button type="submit" class="btn btn--primary btn--block" data-submit>
      <span data-i18n-ar="تسجيل الدخول" data-i18n-en="Sign In">Sign In</span>
    </button>
  </form>

  <p class="text-center" style="margin-top: var(--space-5);">
    <a href="forgot-password.html" data-i18n-ar="نسيت كلمة المرور؟" data-i18n-en="Forgot your password?">Forgot your password?</a>
  </p>
  <p class="text-center text-muted">
    <span data-i18n-ar="ليس لديك حساب بعد؟" data-i18n-en="Don't have an account yet?">Don't have an account yet?</span>
    <a href="activate.html" data-i18n-ar="فعّل حسابك" data-i18n-en="Activate your account">Activate your account</a>
  </p>
</main>

<footer class="site-footer">

      © CESS
    </span>
  </div>
</footer>
